{% assign publication = include.publication %}

<article class="publication-list-item">
  <div class="publication-list-item__meta">
    <span class="publication-list-item__venue">{{ publication.venue }}</span>
    <time datetime="{{ publication.date | date_to_xmlschema }}">{{ publication.date | date: "%Y" }}</time>
  </div>
  <div class="publication-list-item__body">
    <h3 class="publication-list-item__title">{{ publication.title }}</h3>
    <p class="publication-list-item__authors">{{ publication.authors }}</p>

  </div>
</article>
